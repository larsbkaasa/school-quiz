<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="500" fill="#e9dccb"/>
  <rect x="30" y="30" width="540" height="440" rx="20" fill="#ffffff" stroke="#1c2540" stroke-width="4"/>
  <text x="60" y="95" fill="#1c2540" font-size="40" font-weight="700">KAKAOKJEKS</text>
  <text fill="#1c2540" font-size="32">
    <tspan x="60" y="160" font-weight="700">Ingredienser:</tspan>
    <tspan x="60" y="205">sukker, <tspan font-weight="700">HVETEMEL</tspan>,</tspan>
    <tspan x="60" y="250">vegetabilsk fett (palme,</tspan>
    <tspan x="60" y="295">raps), kakao 6 %,</tspan>
